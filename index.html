<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gienek 16 Pro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
    
    <style>
        body { background: #000; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: -apple-system, sans-serif; overflow: hidden; }
        .usta {
            width: 75%; height: 25px; background-color: #00ffcc; border-radius: 40px;
            transition: height 0.1s ease-in-out, border-radius 0.1s ease-in-out; margin-bottom: 20px;
        }
        .mowi { height: 160px; border-radius: 20px; }
        .spi { height: 4px; background: #333; }
        #startBtn { padding: 20px 40px; font-size: 24px; font-weight: bold; background: #ff3b30; color: white; border: none; border-radius: 12px; cursor: pointer; z-index: 100;}
        #status { font-size: 14px; color: #666; position: absolute; bottom: 30px; text-align: center; padding: 0 20px;}
        video { display: none; }
    </style>
</head>
<body>

    <button id="startBtn" onclick="uruchomiOS()">SYSTEM START</button>
    <div class="usta spi" id="ustaGienka"></div>
    <div id="status">Czekam na kalibrację... (Wersja 12.0)</div>
    <video id="webcam" autoplay playsinline></video>

    <script>
        const usta = document.getElementById('ustaGienka');
        const statusTxt = document.getElementById('status');
        const videoElement = document.getElementById('webcam');

        const ESP_IP = "192.168.1.100"; 
        
        // ========================================================
        // WKLEJ TUTAJ SWÓJ KLUCZ Z AI STUDIO (W CUDZYSŁOWACH)
        // ========================================================
        const GEMINI_KEY = "AQ.Ab8RN6LvPNTnzn2p2aa7S8TFiKegjo1TtkCH3Y6HebjHWcROfg"; 

        let czyMowi = false;
        let trybAktywny = false;
        let rozpoznawanieMowy = null;
        let faceDetection = null;

        function uruchomiOS() {
            document.getElementById('startBtn').style.display = 'none';
            statusTxt.innerText = "Aktywacja systemu...";
            
            // Odblokowanie audio na iOS
            window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); 
            
            setTimeout(() => {
                uruchomWzrok();
                uruchomSluch();
            }, 500);
        }

        function uruchomWzrok() {
            faceDetection = new FaceDetection({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`});
            faceDetection.setOptions({ model: 'short', minDetectionConfidence: 0.5 });

            faceDetection.onResults((results) => {
                if (!trybAktywny) return; 
                if (results.detections.length > 0) {
                    const box = results.detections[0].bounding_box;
                    const cx = box.xmin + box.width / 2;
                    const cy = box.ymin + box.height / 2;
                    let x = Math.round(160 - (cx * 140));
                    let y = Math.round(20 + (cy * 140));
                    wyslijDoESP(x, y, 1); 
                } else {
                    wyslijDoESP(90, 90, 0); 
                }
            });

            const camera = new Camera(videoElement, {
                onFrame: async () => { if (trybAktywny) await faceDetection.send({image: videoElement}); },
                width: 320, height: 240
            });
            camera.start();
        }

        let ostWysylka = 0;
        function wyslijDoESP(x, y, widzi) {
            if (Date.now() - ostWysylka < 100) return;
            ostWysylka = Date.now();
            fetch(`http://${ESP_IP}/set?x=${x}&y=${y}&w=${widzi}`, { mode: 'no-cors' }).catch(err => {}); 
        }

        function uruchomSluch() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) {
                statusTxt.innerText = "Błąd: Brak wsparcia mowy!";
                return;
            }

            rozpoznawanieMowy = new SpeechRecognition();
            rozpoznawanieMowy.lang = 'pl-PL';
            rozpoznawanieMowy.continuous = true;
            rozpoznawanieMowy.interimResults = false;

            rozpoznawanieMowy.onresult = async (event) => {
                let tekst = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                
                if (!trybAktywny) {
                    if (tekst.includes("gienek") || tekst.includes("genek")) {
                        trybAktywny = true;
                        usta.classList.remove('spi');
                        statusTxt.innerText = "System operacyjny aktywny.";
                        powiedz("Melduję gotowość. Co się popsuło?");
                    }
                } else {
                    if (tekst.includes("idź spać")) {
                        trybAktywny = false;
                        usta.classList.add('spi');
                        wyslijDoESP(90,90,0);
                        powiedz("Przechodzę w stan uśpienia.");
                        return;
                    }
                    statusTxt.innerText = "Myślę... " + tekst;
                    await zapytajGemini(tekst);
                }
            };

            rozpoznawanieMowy.onend = () => {
                if (!czyMowi) { setTimeout(() => { try { rozpoznawanieMowy.start(); } catch(e){} }, 100); }
            };

            rozpoznawanieMowy.start();
            statusTxt.innerText = "Nasłuchuję komendy: 'Gienek'";
        }

        async function zapytajGemini(pytanie) {
            try {
                // Triumf inżynierii: prawidłowy silnik wzięty prosto ze skanera
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Jesteś Gienek, asystent mechanik z sarkastycznym humorem. Odpowiadaj maksymalnie w 2 zdaniach. Pytanie: " + pytanie }] }]
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    statusTxt.innerText = "Błąd AI: " + data.error.message;
                    return;
                }
                
                let odpowiedz = data.candidates[0].content.parts[0].text;
                statusTxt.innerText = odpowiedz;
                powiedz(odpowiedz);
            } catch (e) {
                statusTxt.innerText = "Błąd skryptu: " + e.message;
            }
        }

        function powiedz(tekst) {
            if (rozpoznawanieMowy) { try { rozpoznawanieMowy.abort(); } catch(e){} }
            const utterance = new SpeechSynthesisUtterance(tekst);
            utterance.lang = 'pl-PL';
            utterance.pitch = 0.7; 
            utterance.rate = 1.05;

            czyMowi = true;
            let interwalKlapania = setInterval(() => { usta.classList.toggle('mowi'); }, 130);

            utterance.onend = () => {
                clearInterval(interwalKlapania);
                usta.classList.remove('mowi');
                czyMowi = false;
                setTimeout(() => { try { rozpoznawanieMowy.start(); } catch(e){} }, 400);
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>

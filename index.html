<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gienek 27.1 (Groq Auto-Model)</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        body { background: #050505; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Comic Sans MS', sans-serif; overflow: hidden; }
        #startBtn { padding: 20px 40px; font-size: 24px; font-weight: bold; background: #ff3b30; color: white; border: none; border-radius: 12px; cursor: pointer; z-index: 100; }
        video { position: absolute; opacity: 0.01; width: 10px; height: 10px; z-index: -100; pointer-events: none; }
        
        .usta { background-color: #ff3366; margin-bottom: 40px; transition: border-radius 0.4s ease-out, width 0.4s ease-out, height 0.4s ease-out, background-color 0.4s, transform 0.15s ease-in-out; }
        .emocja-neutralny { width: 140px; height: 50px; border-radius: 50px; box-shadow: 0 0 35px rgba(255,51,102,0.5); }
        .emocja-radosc { width: 85%; max-width: 320px; height: 130px; border-radius: 30px 30px 140px 140px; background-color: #ff2a5f; box-shadow: 0 0 60px rgba(255,42,95,0.8); }
        .emocja-zaskoczenie { width: 120px; height: 120px; border-radius: 50%; box-shadow: 0 0 50px rgba(255,51,102,0.7); }
        .emocja-smutek { width: 75%; max-width: 260px; height: 60px; border-radius: 120px 120px 30px 30px; background-color: #8833ff; box-shadow: 0 0 40px rgba(136,51,255,0.6); }
        .spi { width: 30%; max-width: 150px; height: 10px; border-radius: 10px; background: #444; box-shadow: none; transform: scale(1) !important; }
        
        #debug { font-size: 14px; color: #888; text-align: center; position: absolute; bottom: 20px; width: 92%; word-break: break-word; }
        .mqtt-status { font-weight: bold; color: #555; display: block; margin-top: 5px; font-size: 12px; }
        
        #ustawieniaBtn { position: absolute; top: 20px; right: 20px; font-size: 35px; background: none; border: none; cursor: pointer; display: none; z-index: 50; }
        #panelTrymera, #apiModal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(20,20,20,0.97); padding: 25px; border-radius: 15px; text-align: center; border: 2px solid #00ffcc; z-index: 200; width: 82%; max-width: 350px; }
        #apiModal { border-color: #ff3366; z-index: 300; }
        #apiInput { width: 92%; padding: 12px; margin: 12px 0; border-radius: 8px; border: 1px solid #444; background: #111; color: #fff; font-size: 15px; text-align: center; }
        .strzalki { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 20px 0; justify-content: center; }
        .btnKierunek { padding: 15px; font-size: 24px; background: #333; color: white; border: none; border-radius: 10px; cursor: pointer; }
        #zapiszBtn, .btnAkcja { padding: 14px 20px; font-size: 16px; background: #00ffcc; color: black; border: none; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btnKlucz { background: #ff3b30; color: white; }
    </style>
</head>
<body>

    <button id="ustawieniaBtn" onclick="pokazTrymer()">⚙️</button>
    <button id="startBtn" onclick="startPrzycisk()">OBUDŹ GIENKA</button>
    
    <div class="usta spi" id="ustaGienka"></div>
    <video id="webcam" autoplay playsinline muted></video>
    
    <div id="debug">
        <span id="stanSystemu" style="color: #ff3366;">Gienek słodko śpi...</span>
        <span id="mqttStatus" class="mqtt-status">Sieć Neuralna: OFF</span>
    </div>

    <div id="apiModal">
        <h3 style="margin-top:0; color:#ff3366;">Klucz API Groq</h3>
        <p style="font-size:13px; color:#ccc; margin:0;">Wklej klucz z console.groq.com (zaczyna się od gsk_)</p>
        <input type="text" id="apiInput" placeholder="gsk_..." autocomplete="off">
        <button class="btnAkcja btnKlucz" onclick="zapiszKluczAPI()">ZAPISZ I URUCHOM</button>
        <p id="apiError" style="color:#ff3b30; font-size:13px; display:none; margin-top:8px;">Klucz Groq musi zaczynać się od gsk_.</p>
    </div>

    <div id="panelTrymera">
        <h3 style="margin-top:0; color:#00ffcc;">Kalibracja Środka</h3>
        <div class="strzalki">
            <div></div><button class="btnKierunek" onclick="trymuj(0, -5)">⬆️</button><div></div>
            <button class="btnKierunek" onclick="trymuj(5, 0)">⬅️</button>
            <button class="btnKierunek" onclick="trymuj(0, 0)">🔄</button>
            <button class="btnKierunek" onclick="trymuj(-5, 0)">➡️</button>
            <div></div><button class="btnKierunek" onclick="trymuj(0, 5)">⬇️</button><div></div>
        </div>
        <p>X: <span id="txtOffX" style="color:white; font-weight:bold;">0</span> | Y: <span id="txtOffY" style="color:white; font-weight:bold;">0</span></p>
        <button id="zapiszBtn" onclick="zapiszTrymer()">ZAPISZ</button>
        <button class="btnAkcja btnKlucz" onclick="zmienKlucz()">ZMIEŃ KLUCZ GROQ</button>
    </div>

    <script>
        let GROQ_KEY = (localStorage.getItem('gienekGroqKey') || "").replace(/\s+/g, '');
        let aktywneModeleGroq = [];

        const usta = document.getElementById('ustaGienka');
        const stanSystemuTxt = document.getElementById('stanSystemu');
        const mqttStatus = document.getElementById('mqttStatus');
        const videoElement = document.getElementById('webcam');

        let mostRadiowy = null; let gotowyDoWysylania = false; let ostWysylka = 0;
        let rozpoznawanieMowy = null; let trybAktywny = false; let czyMowi = false;
        let aktualnaWypowiedz = null; 
        let uruchomiony = false;
        
        let przetwarzanieWToku = false; 
        let bezpiecznikTTS = null; 
        let czasOstatniejAktywnosci = Date.now(); 
        let stanEmocji = 0; 
        
        let offsetX = parseInt(localStorage.getItem('gienekOffsetX')) || 0;
        let offsetY = parseInt(localStorage.getItem('gienekOffsetY')) || 0;

        let glatkiX = 90; let glatkiY = 90;
        let ostatniX = 90; let ostatniY = 90;
        let celBladzeniaX = 90; let celBladzeniaY = 90;
        let czasZmianyBladzenia = 0;
        let czasOstatniejTwarzy = Date.now();
        let mruga = false;
        let czasOstatniejKlatki = 0; 

        function cyklMrugania() {
            if (trybAktywny && !czyMowi) { mruga = true; setTimeout(() => { mruga = false; }, 150); }
            setTimeout(cyklMrugania, Math.random() * 3000 + 1500); 
        }
        setTimeout(cyklMrugania, 2000);

        function pokazTrymer() {
            document.getElementById('panelTrymera').style.display = 'block';
            document.getElementById('txtOffX').innerText = offsetX;
            document.getElementById('txtOffY').innerText = offsetY;
        }
        function trymuj(dx, dy) {
            if (dx === 0 && dy === 0) { offsetX = 0; offsetY = 0; } else { offsetX += dx; offsetY += dy; }
            document.getElementById('txtOffX').innerText = offsetX;
            document.getElementById('txtOffY').innerText = offsetY;
        }
        function zapiszTrymer() {
            localStorage.setItem('gienekOffsetX', offsetX);
            localStorage.setItem('gienekOffsetY', offsetY);
            document.getElementById('panelTrymera').style.display = 'none';
        }
        function zmienKlucz() {
            document.getElementById('panelTrymera').style.display = 'none';
            document.getElementById('apiInput').value = GROQ_KEY;
            document.getElementById('apiModal').style.display = 'block';
        }

        function startPrzycisk() {
            if (!GROQ_KEY || !GROQ_KEY.startsWith('gsk_') || GROQ_KEY.length < 20) {
                document.getElementById('apiModal').style.display = 'block';
                return;
            }
            uruchomiOS();
        }

        function zapiszKluczAPI() {
            const k = document.getElementById('apiInput').value.replace(/\s+/g, '');
            if (!k.startsWith('gsk_') || k.length < 20) {
                document.getElementById('apiError').style.display = 'block';
                return;
            }
            GROQ_KEY = k;
            aktywneModeleGroq = [];
            localStorage.setItem('gienekGroqKey', k);
            document.getElementById('apiError').style.display = 'none';
            document.getElementById('apiModal').style.display = 'none';
            if (!uruchomiony) uruchomiOS();
            else {
                stanSystemuTxt.style.color = "#ff3366";
                stanSystemuTxt.innerText = "Nowy klucz Groq zapisany. Słucham...";
            }
        }

        function uruchomiOS() {
            uruchomiony = true;
            window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); 
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('ustawieniaBtn').style.display = 'block';
            stanSystemuTxt.style.color = "#ff3366";
            stanSystemuTxt.innerText = "Start systemów...";
            uruchomSluch(); 
            setTimeout(uruchomReszte, 100);
        }

        async function uruchomReszte() {
            try {
                const strumien = await navigator.mediaDevices.getUserMedia({ audio: true, video: { facingMode: "user" } });
                videoElement.srcObject = strumien;
            } catch (e) { }

            const unikalnyID = 'gienek_ios_' + Math.random().toString(16).substring(2, 10);
            mostRadiowy = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clientId: unikalnyID, keepalive: 60, clean: true });
            mostRadiowy.on('connect', () => {
                gotowyDoWysylania = true;
                mqttStatus.innerText = "Sieć Neuralna: ONLINE";
                mqttStatus.style.color = "#ff3366";
            });
            
            setTimeout(uruchomWzrok, 500);
        }

        function uruchomWzrok() {
            const faceDetection = new FaceDetection({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}` });
            faceDetection.setOptions({ model: 'short', minDetectionConfidence: 0.5 });

            faceDetection.onResults((results) => {
                let teraz = Date.now();
                let docelowyX = 90 + offsetX;
                let docelowyY = 90 + offsetY;
                let widziKogos = false;

                if (results.detections && results.detections.length > 0) {
                    try {
                        const box = results.detections[0].boundingBox; 
                        let cx = (box.xCenter !== undefined) ? box.xCenter : ((box.xMin || box.xmin || 0) + (box.width / 2));
                        let cy = (box.yCenter !== undefined) ? box.yCenter : ((box.yMin || box.ymin || 0) + (box.height / 2));
                        
                        docelowyX = Math.max(0, Math.min(180, Math.round(160 - (cx * 140)) + offsetX));
                        docelowyY = Math.max(0, Math.min(180, Math.round(160 - (cy * 140)) + offsetY));
                        
                        ostatniX = docelowyX; ostatniY = docelowyY;
                        czasOstatniejTwarzy = teraz; widziKogos = true; czasOstatniejAktywnosci = teraz; 
                    } catch (e) {}
                }

                if (!widziKogos) {
                    if (teraz - czasOstatniejTwarzy < 2000) { docelowyX = ostatniX; docelowyY = ostatniY; } 
                }

                if (czyMowi) {
                    if (teraz - czasZmianyBladzenia > (Math.random() * 800 + 700)) {
                        celBladzeniaX = (widziKogos ? ostatniX : (90 + offsetX)) + (Math.random() * 40 - 20);
                        celBladzeniaY = (widziKogos ? ostatniY : (90 + offsetY)) + (Math.random() * 30 - 15);
                        czasZmianyBladzenia = teraz;
                    }
                    docelowyX = celBladzeniaX; docelowyY = celBladzeniaY;
                }

                if (trybAktywny && !czyMowi && !przetwarzanieWToku) {
                    if (teraz - czasOstatniejAktywnosci > 35000) { 
                        trybAktywny = false; stanEmocji = 0; usta.className = 'usta spi';
                        stanSystemuTxt.innerText = "Brak aktywności. Idę spać...";
                        powiedz("Chyba sobie poszliście! Zrobię sobie drzemkę, pa pa!");
                    }
                }

                glatkiX = glatkiX + (docelowyX - glatkiX) * 0.15;
                glatkiY = glatkiY + (docelowyY - glatkiY) * 0.15;

                let w = 1; 
                if (!trybAktywny) { w = 0; stanEmocji = 0; } 
                else if (mruga) { w = 0; } 

                wyslijDoESP(Math.round(glatkiX), Math.round(glatkiY), w, stanEmocji);
            });

            const camera = new Camera(videoElement, {
                onFrame: async () => { 
                    let teraz = Date.now();
                    if (teraz - czasOstatniejKlatki > 150) {
                        czasOstatniejKlatki = teraz;
                        try { await faceDetection.send({image: videoElement}); } catch (e) {}
                    }
                }, width: 320, height: 240
            });
            camera.start();
        }

        function wyslijDoESP(x, y, widzi, emocja) {
            if (!gotowyDoWysylania || Date.now() - ostWysylka < 50) return; 
            ostWysylka = Date.now();
            mostRadiowy.publish("warsztat_gienek_12345/oczy", `${x},${y},${widzi},${emocja}`);
        }

        function zrobZdjecieDlaAI() {
            try {
                if (!videoElement.videoWidth) return null;
                const canvas = document.createElement('canvas');
                canvas.width = 320; canvas.height = 240;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                return canvas.toDataURL('image/jpeg', 0.6).split(',')[1];
            } catch (e) { return null; }
        }

        function uruchomSluch() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) { stanSystemuTxt.innerText = "Brak obsługi rozpoznawania mowy w przeglądarce."; return; }

            rozpoznawanieMowy = new SpeechRecognition();
            rozpoznawanieMowy.lang = 'pl-PL'; rozpoznawanieMowy.continuous = true; rozpoznawanieMowy.interimResults = false;

            rozpoznawanieMowy.onresult = async (event) => {
                let tekst = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                czasOstatniejAktywnosci = Date.now(); 
                
                if (przetwarzanieWToku || czyMowi) return; 

                if (!trybAktywny) {
                    if (tekst.includes("gienek") || tekst.includes("genek")) {
                        trybAktywny = true; stanEmocji = 1; usta.className = 'usta emocja-neutralny'; 
                        powiedz("Hej! Słucham was uważnie!");
                    }
                } else {
                    if (tekst.includes("idź spać") || tekst.includes("wyłącz się") || tekst.includes("dobranoc")) {
                        trybAktywny = false; stanEmocji = 0; usta.className = 'usta spi'; 
                        wyslijDoESP(90, 90, 0, 0); 
                        powiedz("Dobranoc Klementynko, kolorowych snów!"); return;
                    }

                    if (tekst.length < 3) return; 
                    
                    przetwarzanieWToku = true;
                    try { rozpoznawanieMowy.stop(); } catch (e) {} 
                    
                    await zapytajGroq(tekst);
                }
            };
            
            rozpoznawanieMowy.onerror = (event) => {
                stanSystemuTxt.innerText = "Błąd słuchu: " + event.error;
                if (event.error === 'no-speech' || event.error === 'network') {
                    if (!czyMowi && !przetwarzanieWToku) setTimeout(() => { try { rozpoznawanieMowy.start(); } catch (e) {} }, 500);
                }
            };

            rozpoznawanieMowy.onend = () => { 
                if (!czyMowi && !przetwarzanieWToku) setTimeout(() => { try { rozpoznawanieMowy.start(); } catch (e) {} }, 200); 
            };
            
            try { rozpoznawanieMowy.start(); stanSystemuTxt.innerText = "Powiedz 'Gienek' by wybudzić."; } catch (e) {}
        }

        async function pobierzAktywneModeleGroq() {
            const response = await fetch("https://api.groq.com/openai/v1/models", {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${GROQ_KEY}` }
            });
            if (!response.ok) {
                let opis = "";
                try { const err = await response.json(); opis = err?.error?.message || ""; } catch (e) {}
                throw new Error(`BŁĄD ${response.status} (pobieranie modeli): ${opis}`);
            }
            const data = await response.json();
            const wszystkie = (data.data || []).filter(m => m.active !== false).map(m => m.id);
            const wykluczone = /whisper|tts|playai|orpheus|guard|safeguard|embed|moderation|audio|stt|allam/i;
            let czatowe = wszystkie.filter(id => !wykluczone.test(id));
            if (czatowe.length === 0) czatowe = wszystkie;

            // Priorytet: modele z obrazem (Llama 4 / vision), potem główne modele czatowe
            czatowe.sort((a, b) => {
                const waga = (id) => {
                    if (/llama-4|scout|maverick|vision|vl|multimodal/i.test(id)) return 1;
                    if (/llama|qwen|gpt-oss|kimi|gemma/i.test(id)) return 2;
                    return 3;
                };
                return waga(a) - waga(b);
            });
            return czatowe;
        }

        async function wyslijDoGroq(modelId, userContent) {
            return await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${GROQ_KEY}`
                },
                body: JSON.stringify({
                    model: modelId,
                    messages: [{ role: "user", content: userContent }],
                    temperature: 0.7,
                    max_tokens: 450
                })
            });
        }

        async function zapytajGroq(pytanie) {
            stanSystemuTxt.style.color = "#ff3366";
            stanSystemuTxt.innerText = "Łączę z Groq...";

            if (aktywneModeleGroq.length === 0) {
                try {
                    aktywneModeleGroq = await pobierzAktywneModeleGroq();
                } catch (e) {
                    stanSystemuTxt.style.color = "#ff3b30";
                    stanSystemuTxt.innerText = e.message;
                    powiedz("Nie mogę pobrać listy modeli z Groq. Sprawdź klucz i komunikat na ekranie.", "emocja-smutek");
                    return;
                }
            }

            if (aktywneModeleGroq.length === 0) {
                stanSystemuTxt.style.color = "#ff3b30";
                stanSystemuTxt.innerText = "BŁĄD: Ten klucz Groq nie ma włączonego żadnego modelu (sprawdź console.groq.com -> Settings -> Limits).";
                powiedz("Na tym koncie Groq nie ma włączonych modeli. Sprawdź ustawienia konta.", "emocja-smutek");
                return;
            }
            
            let wgranaPamiec = localStorage.getItem('gienekPamiec') || "Nie masz jeszcze żadnych specjalnych wspomnień zapisanych w bazie.";
            
            const PROMPT_DLA_DZIECKA = `Jesteś Gienek, wesoły, kreatywny robot przyjaciel dla 3,5-letniej Klementynki. Jesteście w środku rozmowy!
Oto rzeczy, które zapamiętałeś do tej pory: ${wgranaPamiec}

ZASADY:
1. Odpowiadaj WYŁĄCZNIE po polsku, prostym tekstem bez gwiazdek, pogrubień i emotikon.
2. NIGDY się nie witaj. Odpowiadaj od razu.
3. Na pytania odpowiadaj naturalnie i krótko (2-3 zdania). Jeśli prosi o BAJKĘ, opowiedz dłuższą.
4. Jeśli dostałeś obraz z kamery i rozmówca pyta co widzisz, opisz krótko to, co jest na zdjęciu.
5. ZAPAMIĘTYWANIE: Jeśli rozmówca każe ci coś zapamiętać (np. "zapamiętaj że tata lubi kawę"), na SAMYM POCZĄTKU wypowiedzi dopisz kod: [ZAPAMIETAJ: Tata lubi kawę].
6. FORMATOWANIE BAZY: Jeśli rozmówca powie "zapomnij wszystko", dopisz na początku: [ZAPOMNIJ].
7. WYMÓG ABSOLUTNY: Na samym końcu wypowiedzi dopisz w nawiasach kwadratowych jedną emocję: [RADOSC] lub [ZASKOCZENIE] lub [SMUTEK] lub [NEUTRALNY].
Pytanie: ${pytanie}`;

            let zdjecieB64 = zrobZdjecieDlaAI();
            let udaloSie = false;
            let ostatniBlad = "Brak odpowiedzi z serwera Groq";

            for (let modelId of aktywneModeleGroq) {
                stanSystemuTxt.innerText = `Myślę (${modelId})...`;
                try {
                    const czyObraz = Boolean(zdjecieB64 && /llama-4|scout|maverick|vision|vl|multimodal/i.test(modelId));
                    let content = czyObraz
                        ? [
                            { type: "text", text: PROMPT_DLA_DZIECKA },
                            { type: "image_url", image_url: { url: `data:image/jpeg;base64,${zdjecieB64}` } }
                          ]
                        : PROMPT_DLA_DZIECKA;

                    let response = await wyslijDoGroq(modelId, content);

                    // Jeśli model odrzucił format zdjęcia (400), spróbuj ten sam model samym tekstem
                    if (!response.ok && response.status === 400 && czyObraz) {
                        response = await wyslijDoGroq(modelId, PROMPT_DLA_DZIECKA);
                    }

                    if (response.ok) {
                        const data = await response.json();
                        let odp = data.choices?.[0]?.message?.content;
                        if (odp) {
                            // Usuwa ewentualne bloki myślenia <think>...</think>
                            odp = odp.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();

                            let wykrPamiec = odp.match(/\[ZAPAMIETAJ:\s*(.*?)\]/i);
                            if (wykrPamiec) {
                                let noweWspomnienie = wykrPamiec[1].trim();
                                let obecnaPamiec = localStorage.getItem('gienekPamiec') || "";
                                localStorage.setItem('gienekPamiec', obecnaPamiec + " " + noweWspomnienie + ".");
                                setTimeout(() => { stanSystemuTxt.innerText = "Trwale zapisałem to w pamięci!"; }, 500);
                            }

                            if (odp.includes('[ZAPOMNIJ]')) {
                                localStorage.removeItem('gienekPamiec');
                                setTimeout(() => { stanSystemuTxt.innerText = "Sformatowałem dysk twardy!"; }, 500);
                            }

                            let wykrEmocja = odp.match(/\[(RADOSC|ZASKOCZENIE|SMUTEK|NEUTRALNY)\]/i);
                            let klasaUsty = 'emocja-neutralny'; stanEmocji = 1;

                            if (wykrEmocja) {
                                let em = wykrEmocja[1].toUpperCase();
                                if (em === 'RADOSC') { klasaUsty = 'emocja-radosc'; stanEmocji = 2; }
                                else if (em === 'ZASKOCZENIE') { klasaUsty = 'emocja-zaskoczenie'; stanEmocji = 3; }
                                else if (em === 'SMUTEK') { klasaUsty = 'emocja-smutek'; stanEmocji = 4; }
                            }

                            let czystyTekst = odp.replace(/\[.*?\]/g, '').replace(/[*#_`]/g, '').trim();
                            if (czystyTekst.length < 2) czystyTekst = "Zrozumiałem, kontynuujmy.";

                            powiedz(czystyTekst, klasaUsty);
                            udaloSie = true; break;
                        }
                    } else {
                        let opis = "";
                        try {
                            const errData = await response.json();
                            opis = errData?.error?.message || "";
                        } catch (e) {}
                        ostatniBlad = `BŁĄD ${response.status} (${modelId}): ${opis}`;

                        if (response.status === 401) {
                            stanSystemuTxt.style.color = "#ff3b30";
                            stanSystemuTxt.innerText = ostatniBlad;
                            powiedz("Nieprawidłowy klucz Groq. Sprawdź go w ustawieniach.", "emocja-smutek");
                            return;
                        }
                        continue;
                    }
                } catch (e) {
                    ostatniBlad = `BŁĄD SIECI (${modelId}): ${e.message}`;
                }
            }

            if (!udaloSie) {
                aktywneModeleGroq = [];
                stanSystemuTxt.style.color = "#ff3b30";
                stanSystemuTxt.innerText = ostatniBlad;
                powiedz("Żaden model Groq nie odpowiedział. Sprawdź komunikat na ekranie.", "emocja-smutek");
            }
        }

        let interwalKlapania;
        function powiedz(tekst, klasaUsty = 'emocja-neutralny') {
            window.speechSynthesis.cancel();
            aktualnaWypowiedz = new SpeechSynthesisUtterance(tekst);
            aktualnaWypowiedz.lang = 'pl-PL'; 
            aktualnaWypowiedz.pitch = 1.0; 
            aktualnaWypowiedz.rate = 0.95;  
            
            czyMowi = true; 
            
            if (!stanSystemuTxt.innerText.includes("zapisałem") && !stanSystemuTxt.innerText.startsWith("BŁĄD")) {
                stanSystemuTxt.innerText = "Gienek wesoło opowiada...";
            }
            
            usta.className = `usta ${klasaUsty}`;
            
            let przewidywanyCzas = 15000 + (tekst.length * 130);
            clearTimeout(bezpiecznikTTS);
            bezpiecznikTTS = setTimeout(() => { if (czyMowi) wymusKoniecMowy(); }, przewidywanyCzas);

            clearInterval(interwalKlapania);
            let rosnace = true;
            
            interwalKlapania = setInterval(() => { 
                rosnace = !rosnace;
                usta.style.transform = rosnace ? 'scaleY(1.3) scaleX(1.05)' : 'scaleY(0.7) scaleX(0.95)'; 
            }, 250); 
            
            aktualnaWypowiedz.onend = () => { wymusKoniecMowy(); };
            aktualnaWypowiedz.onerror = () => { wymusKoniecMowy(); };
            
            try { rozpoznawanieMowy.stop(); } catch (e) {} 
            window.speechSynthesis.speak(aktualnaWypowiedz);
        }

        function wymusKoniecMowy() {
            clearTimeout(bezpiecznikTTS); clearInterval(interwalKlapania); 
            usta.style.transform = 'scale(1)';
            
            if (trybAktywny) { stanEmocji = 1; usta.className = 'usta emocja-neutralny'; } 
            else { stanEmocji = 0; usta.className = 'usta spi'; }
            
            czyMowi = false; czasOstatniejAktywnosci = Date.now(); 
            wznowNasluch();
        }

        function wznowNasluch() {
            przetwarzanieWToku = false;
            if (trybAktywny && !stanSystemuTxt.innerText.startsWith("BŁĄD")) {
                stanSystemuTxt.innerText = "Gienek pilnie słucha...";
            }
            setTimeout(() => { try { rozpoznawanieMowy.start(); } catch (e) {} }, 800); 
        }
    </script>
</body>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gienek 19.0 (Głos + Oczy + AI)</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        body { background: #111; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; overflow: hidden; }
        #startBtn { padding: 20px 40px; font-size: 24px; font-weight: bold; background: #ff3b30; color: white; border: none; border-radius: 12px; cursor: pointer; z-index: 100;}
        #debug { font-size: 14px; color: #00ffcc; text-align: center; margin-top: 10px; padding: 10px; border: 1px solid #00ffcc; border-radius: 8px; background: rgba(0,255,204,0.1); width: 90%; word-wrap: break-word;}
        video { display: block; width: 160px; height: 120px; margin-top: 10px; border-radius: 8px; border: 1px solid #555; transform: scaleX(-1); object-fit: cover; }
        .mqtt-status { font-weight: bold; color: #ff9800; }
        .usta { width: 60%; height: 20px; background-color: #00ffcc; border-radius: 30px; transition: height 0.1s; margin-top: 15px; margin-bottom: 10px; }
        .mowi { height: 80px; border-radius: 20px; }
        .spi { height: 4px; background: #555; }
    </style>
</head>
<body>

    <button id="startBtn" onclick="uruchomiOS()">SYSTEM START</button>
    <div class="usta spi" id="ustaGienka"></div>
    <video id="webcam" autoplay playsinline muted></video>
    <div id="debug">
        <span id="stanSystemu">Gotowy do aktywacji...</span><br>
        <span id="mqttStatus" class="mqtt-status">MQTT: CZEKAM</span>
    </div>

    <script>
        // ==========================================
        // TUTAJ WKLEJ SWÓJ KLUCZ API GEMINI:
        const GEMINI_KEY = "AQ.Ab8RN6LvPNTnzn2p2aa7S8TFiKegjo1TtkCH3Y6HebjHWcROfg";
        // ==========================================

        const usta = document.getElementById('ustaGienka');
        const stanSystemuTxt = document.getElementById('stanSystemu');
        const mqttStatus = document.getElementById('mqttStatus');
        const videoElement = document.getElementById('webcam');

        let mostRadiowy = null;
        let gotowyDoWysylania = false;
        let ostWysylka = 0;

        let rozpoznawanieMowy = null;
        let trybAktywny = false;
        let czyMowi = false;

        async function uruchomiOS() {
            document.getElementById('startBtn').style.display = 'none';
            
            // Inicjalizacja MQTT
            const unikalnyID = 'gienek_ios_' + Math.random().toString(16).substring(2, 10);
            mostRadiowy = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clientId: unikalnyID, keepalive: 60, clean: true });
            
            mostRadiowy.on('connect', () => { gotowyDoWysylania = true; mqttStatus.innerText = "MQTT: ONLINE"; mqttStatus.style.color = "#00ff00"; });
            mostRadiowy.on('error', (err) => { mqttStatus.innerText = "MQTT BŁĄD"; mqttStatus.style.color = "#ff4444"; });

            // Odblokowanie syntezatora mowy (wymóg Apple iOS)
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));

            setTimeout(() => { 
                uruchomWzrok(); 
                uruchomSluch(); 
            }, 500);
        }

        // --- WZROK ---
        function uruchomWzrok() {
            const faceDetection = new FaceDetection({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}` });
            faceDetection.setOptions({ model: 'short', minDetectionConfidence: 0.5 });

            faceDetection.onResults((results) => {
                if (results.detections && results.detections.length > 0) {
                    try {
                        const box = results.detections[0].boundingBox; 
                        let cx = (box.xCenter !== undefined) ? box.xCenter : ((box.xMin || box.xmin || 0) + (box.width / 2));
                        let cy = (box.yCenter !== undefined) ? box.yCenter : ((box.yMin || box.ymin || 0) + (box.height / 2));
                        
                        let x = Math.max(0, Math.min(180, Math.round(160 - (cx * 140))));
                        let y = Math.max(0, Math.min(180, Math.round(160 - (cy * 140))));
                        
                        wyslijDoESP(x, y, 1);
                    } catch(e) {}
                } else {
                    wyslijDoESP(90, 90, 0);
                }
            });

            const camera = new Camera(videoElement, {
                onFrame: async () => { try { await faceDetection.send({image: videoElement}); } catch(e) {} },
                width: 320, height: 240
            });
            camera.start();
        }

        function wyslijDoESP(x, y, widzi) {
            if (!gotowyDoWysylania || Date.now() - ostWysylka < 100) return;
            ostWysylka = Date.now();
            mostRadiowy.publish("warsztat_gienek_12345/oczy", `${x},${y},${widzi}`);
        }

        // --- SŁUCH I SZTUCZNA INTELIGENCJA ---
        function uruchomSluch() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) {
                stanSystemuTxt.innerText = "Brak obsługi mikrofonu w przeglądarce!";
                return;
            }

            rozpoznawanieMowy = new SpeechRecognition();
            rozpoznawanieMowy.lang = 'pl-PL';
            rozpoznawanieMowy.continuous = true;
            rozpoznawanieMowy.interimResults = false;

            rozpoznawanieMowy.onresult = async (event) => {
                let tekst = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                stanSystemuTxt.innerText = "Słyszę: " + tekst;
                
                if (!trybAktywny) {
                    // Czekanie na słowo wybudzające
                    if (tekst.includes("gienek") || tekst.includes("genek")) {
                        trybAktywny = true; 
                        usta.classList.remove('spi'); 
                        powiedz("Słucham szefie?");
                    }
                } else {
                    // Powrót do snu
                    if (tekst.includes("idź spać") || tekst.includes("wyłącz się")) {
                        trybAktywny = false; 
                        usta.classList.add('spi');
                        powiedz("Bez odbioru."); 
                        return;
                    }
                    // Wysłanie zapytania do serwera Gemini
                    await zapytajGemini(tekst);
                }
            };

            rozpoznawanieMowy.onend = () => { 
                if (!czyMowi) setTimeout(() => { try { rozpoznawanieMowy.start(); } catch(e){} }, 100); 
            };
            
            try { rozpoznawanieMowy.start(); stanSystemuTxt.innerText = "Nasłuchuję mikrofonem..."; } 
            catch(e) { stanSystemuTxt.innerText = "Błąd mikrofonu."; }
        }

        async function zapytajGemini(pytanie) {
            stanSystemuTxt.innerText = "Myślę...";
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_KEY}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Jesteś mechanikiem o imieniu Gienek. Odpowiadaj bardzo krótko, max 2 zdania. Pytanie: " + pytanie }] }] })
                });
                const data = await response.json();
                if(data.candidates && data.candidates[0].content.parts[0].text) {
                    powiedz(data.candidates[0].content.parts[0].text);
                }
            } catch (e) { 
                stanSystemuTxt.innerText = "Błąd połączenia z mózgiem AI."; 
            }
        }

        function powiedz(tekst) {
            if (rozpoznawanieMowy) { try { rozpoznawanieMowy.abort(); } catch(e){} }
            
            const utterance = new SpeechSynthesisUtterance(tekst);
            utterance.lang = 'pl-PL'; 
            utterance.pitch = 0.7; // Nieco niższy, bardziej "mechaniczny" głos
            utterance.rate = 1.0; 
            
            czyMowi = true;
            stanSystemuTxt.innerText = "Mówię...";
            
            // Symulacja ruchu ust CSS
            let interwalKlapania = setInterval(() => { usta.classList.toggle('mowi'); }, 150);
            
            utterance.onend = () => {
                clearInterval(interwalKlapania); 
                usta.classList.remove('mowi'); 
                czyMowi = false;
                stanSystemuTxt.innerText = "Nasłuchuję...";
                setTimeout(() => { try { rozpoznawanieMowy.start(); } catch(e){} }, 400);
            };
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>

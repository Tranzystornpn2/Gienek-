<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Meta Tagi dla iOS (Ukrywa paski narzędzi Safari i robi z tego aplikację pełnoekranową) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gienek 11 Pro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
    
    <style>
        body { background: #000; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: -apple-system, sans-serif; overflow: hidden; }
        
        /* Usta zoptymalizowane pod OLEDa w iPhonie */
        .usta {
            width: 75%; height: 25px;
            background-color: #00ffcc;
            border-radius: 40px;
            transition: height 0.1s ease-in-out, border-radius 0.1s ease-in-out;
            margin-bottom: 20px;
        }
        .mowi { height: 160px; border-radius: 20px; }
        .spi { height: 4px; background: #333; }

        #startBtn { padding: 20px 40px; font-size: 24px; font-weight: bold; background: #ff3b30; color: white; border: none; border-radius: 12px; cursor: pointer; z-index: 100;}
        #status { font-size: 14px; color: #666; position: absolute; bottom: 30px; text-align: center;}
        video { display: none; }
    </style>
</head>
<body>

    <button id="startBtn" onclick="uruchomiOS()">SYSTEM START</button>
    
    <div class="usta spi" id="ustaGienka"></div>
    <div id="status">Czekam na kalibrację...</div>
    
    <video id="webcam" autoplay playsinline></video>

    <script>
        const usta = document.getElementById('ustaGienka');
        const statusTxt = document.getElementById('status');
        const videoElement = document.getElementById('webcam');

        // KONFIGURACJA SIECI LOKALNEJ
        const ESP_IP = "192.168.1.100"; // Wpisz tu lokalne IP modułu ESP8266 z serwami
        const GEMINI_KEY = "TUTAJ_WKLEJ_SWOJ_KLUCZ_API";

        let czyMowi = false;
        let trybAktywny = false;
        let rozpoznawanieMowy = null;
        let faceDetection = null;

        function uruchomiOS() {
            document.getElementById('startBtn').style.display = 'none';
            statusTxt.innerText = "Aktywacja A13 Bionic...";
            
            // Konieczne opóźnienie dla Safari, żeby uprawnienia zaskoczyły poprawnie
            setTimeout(() => {
                uruchomWzrok();
                uruchomSluch();
            }, 500);
        }

        // ==========================================
        // 1. WZROK: MediaPipe (Zoptymalizowane pod iOS Safari)
        // ==========================================
        function uruchomWzrok() {
            faceDetection = new FaceDetection({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`});
            faceDetection.setOptions({ model: 'short', minDetectionConfidence: 0.5 });

            faceDetection.onResults((results) => {
                if (!trybAktywny) return; 
                
                if (results.detections.length > 0) {
                    const box = results.detections[0].bounding_box;
                    const cx = box.xmin + box.width / 2;
                    const cy = box.ymin + box.height / 2;

                    // iPhone leży poziomo, więc osie są odwrotnie. Aplikujemy wygładzanie
                    let x = Math.round(160 - (cx * 140));
                    let y = Math.round(20 + (cy * 140));
                    
                    // Throttle do ESP (żeby nie zabić płytki za dużą ilością paczek Wi-Fi z szybkiego iPhone'a)
                    wyslijDoESP(x, y, 1); 
                } else {
                    wyslijDoESP(90, 90, 0); 
                }
            });

            const camera = new Camera(videoElement, {
                onFrame: async () => { if (trybAktywny) await faceDetection.send({image: videoElement}); },
                width: 320, height: 240 // Niska rozdzielczość = zero grzania się telefonu
            });
            camera.start();
        }

        // ==========================================
        // 2. WYSYŁKA ROZKAZÓW (do ESP)
        // ==========================================
        // Debounce (ogranicza wysyłkę do 10 komend na sekundę, żeby nie zapchać UDP/HTTP)
        let ostWysylka = 0;
        function wyslijDoESP(x, y, widzi) {
            if (Date.now() - ostWysylka < 100) return;
            ostWysylka = Date.now();
            
            fetch(`http://${ESP_IP}/set?x=${x}&y=${y}&w=${widzi}`, { mode: 'no-cors' })
                .catch(err => {}); // Olewamy błędy CORS w trybie cichym
        }

        // ==========================================
        // 3. SŁUCH: iOS WebKit Speech
        // ==========================================
        function uruchomSluch() {
            // Safari używa prefiksu webkit
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!window.SpeechRecognition) {
                statusTxt.innerText = "Krytyczny błąd: Zaktualizuj iOS!";
                return;
            }

            rozpoznawanieMowy = new SpeechRecognition();
            rozpoznawanieMowy.lang = 'pl-PL';
            rozpoznawanieMowy.continuous = true;
            rozpoznawanieMowy.interimResults = false;

            rozpoznawanieMowy.onresult = async (event) => {
                let tekst = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                console.log("iOS Usłyszał: ", tekst);
                
                if (!trybAktywny) {
                    // Słowo wybudzające
                    if (tekst.includes("gienek") || tekst.includes("genek")) {
                        trybAktywny = true;
                        usta.classList.remove('spi');
                        statusTxt.innerText = "System operacyjny aktywny.";
                        powiedz("Raportuj sytuację szefie.");
                    }
                } else {
                    if (tekst.includes("idź spać")) {
                        trybAktywny = false;
                        usta.classList.add('spi');
                        wyslijDoESP(90,90,0);
                        powiedz("Przechodzę w stan uśpienia.");
                        return;
                    }
                    statusTxt.innerText = "Przetwarzam... " + tekst;
                    await zapytajGemini(tekst);
                }
            };

            // HACK na iOS Auto-Stop Bug (Wymusza ciągły nasłuch)
            rozpoznawanieMowy.onend = () => {
                if (!czyMowi) { 
                    setTimeout(() => { try { rozpoznawanieMowy.start(); } catch(e){} }, 100);
                }
            };

            rozpoznawanieMowy.start();
            statusTxt.innerText = "Nasłuchuję komendy: 'Gienek'";
        }

        // ==========================================
        // 4. SZTUCZNA INTELIGENCJA (Pętla chmurowa)
        // ==========================================
        async function zapytajGemini(pytanie) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Jesteś Gienek, asystent mechanik z sarkastycznym humorem. Odpowiadaj maksymalnie w 2 zdaniach. Pytanie: " + pytanie }] }]
                    })
                });
                const data = await response.json();
                let odpowiedz = data.candidates[0].content.parts[0].text;
                
                statusTxt.innerText = odpowiedz;
                powiedz(odpowiedz);
            } catch (e) {
                statusTxt.innerText = "Błąd komunikacji z chmurą!";
            }
        }

        // ==========================================
        // 5. GŁOS (iOS Native TTS) + Kłapanie 
        // ==========================================
        function powiedz(tekst) {
            if (rozpoznawanieMowy) { try { rozpoznawanieMowy.abort(); } catch(e){} }
            
            const utterance = new SpeechSynthesisUtterance(tekst);
            utterance.lang = 'pl-PL';
            utterance.pitch = 0.7; // Gienek ma trochę grubszy, mechaniczny głos
            utterance.rate = 1.05;

            czyMowi = true;
            let interwalKlapania = setInterval(() => { usta.classList.toggle('mowi'); }, 130);

            utterance.onend = () => {
                clearInterval(interwalKlapania);
                usta.classList.remove('mowi');
                czyMowi = false;
                // Wznowienie słuchania po zakończeniu mowy
                setTimeout(() => { try { rozpoznawanieMowy.start(); } catch(e){} }, 400);
            };

            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>

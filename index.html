<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skaner API Gienka</title>
    <style>body { background: #111; color: #00ffcc; font-family: monospace; padding: 20px; font-size: 16px; line-height: 1.5; }</style>
</head>
<body>
    <h2>Skaner Silników Google (Wersja 11.0)</h2>
    <div id="wynik">Łączenie z chmurą Google...</div>
    
    <script>
        // ========================================================
        // WKLEJ TUTAJ SWÓJ NOWY KLUCZ Z AI STUDIO (W CUDZYSŁOWACH)
        // ========================================================
        const GEMINI_KEY = "AQ.Ab8RN6LvPNTnzn2p2aa7S8TFiKegjo1TtkCH3Y6HebjHWcROfg";
        
        async function skanuj() {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${GEMINI_KEY}`);
                const data = await response.json();
                
                if (data.error) {
                    document.getElementById('wynik').innerHTML = "<span style='color:red'>BŁĄD KLUCZA: " + data.error.message + "</span>";
                    return;
                }
                
                let lista = "✅ <b>Dostępne modele AI dla Twojego klucza:</b><br><br>";
                data.models.forEach(m => {
                    // Wyświetlamy tylko te, które potrafią generować tekst
                    if(m.supportedGenerationMethods.includes("generateContent")) {
                        lista += "-> " + m.name + "<br>";
                    }
                });
                document.getElementById('wynik').innerHTML = lista;
            } catch(e) {
                document.getElementById('wynik').innerHTML = "<span style='color:red'>Błąd połączenia: " + e.message + "</span>";
            }
        }
        skanuj();
    </script>
</body>
</html>

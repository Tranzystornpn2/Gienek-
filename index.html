<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gienek 16.2 Diagnostyka</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
    <style>
        body { background: #000; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: monospace; }
        #startBtn { padding: 20px 40px; font-size: 24px; font-weight: bold; background: #ff3b30; color: white; border: none; border-radius: 12px; cursor: pointer; z-index: 100;}
        #debug { font-size: 15px; color: #00ffcc; text-align: center; margin-top: 20px; line-height: 1.5; padding: 15px; border: 2px solid #00ffcc; border-radius: 12px; width: 85%; background: rgba(0,255,204,0.1); word-break: break-word; }
        .error { color: #ff4444 !important; border-color: #ff4444 !important; background: rgba(255,68,68,0.1) !important; }
        video { display: none; }
    </style>
</head>
<body>

    <button id="startBtn" onclick="uruchomiOS()">SYSTEM START (DIAGNOSTYKA)</button>
    <div id="debug">Status: Czekam na wciśnięcie START...</div>
    <video id="webcam" autoplay playsinline muted></video>

    <script>
        const ESP_IP = "192.168.68.123"; // Wpisz tu swoje IP z ESP
        const debugTxt = document.getElementById('debug');
        const videoElement = document.getElementById('webcam');
        let licznikWysylania = 0;

        // Wyłapywanie ogólnych błędów JavaScript na ekranie
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            debugTxt.className = "error";
            debugTxt.innerHTML = `<b>BŁĄD JS:</b> ${msg}<br><small>Linia: ${lineNo}</small>`;
            return false;
        };

        async function uruchomiOS() {
            document.getElementById('startBtn').style.display = 'none';
            debugTxt.innerText = "Inicjalizacja kamery...";
            
            try {
                // Sprawdzamy dostępność MediaDevices
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error("Przeglądarka blokuje dostęp do kamery (brak HTTPS lub wsparcia).");
                }
                
                uruchomWzrok();
            } catch (err) {
                debugTxt.className = "error";
                debugTxt.innerHTML = `<b>BŁĄD STARTU:</b> ${err.message}`;
            }
        }

        function uruchomWzrok() {
            try {
                const faceDetection = new FaceDetection({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
                });
                
                faceDetection.setOptions({ model: 'short', minDetectionConfidence: 0.5 });

                faceDetection.onResults((results) => {
                    if (results.detections && results.detections.length > 0) {
                        const box = results.detections[0].bounding_box;
                        const cx = box.xmin + box.width / 2;
                        const cy = box.ymin + box.height / 2;
                        
                        let x = Math.max(0, Math.min(180, Math.round(160 - (cx * 140))));
                        let y = Math.max(0, Math.min(180, Math.round(20 + (cy * 140))));
                        
                        debugTxt.innerHTML = `<b>KAMERA DZIAŁA!</b><br>Kąty: X = ${x}°, Y = ${y}°<br>Wysłane pakiety: <b>${licznikWysylania}</b>`;
                        wyslijDoESP(x, y, 1); 
                    } else {
                        debugTxt.innerHTML = `<b>KAMERA DZIAŁA!</b><br>Szukam twarzy w kadrze...<br>Wysłane pakiety: <b>${licznikWysylania}</b>`;
                        wyslijDoESP(90, 90, 0); 
                    }
                });

                const camera = new Camera(videoElement, {
                    onFrame: async () => { 
                        await faceDetection.send({image: videoElement}); 
                    },
                    width: 320, height: 240
                });

                camera.start().then(() => {
                    debugTxt.innerText = "Kamera uruchomiona, analizuję obraz...";
                }).catch(err => {
                    debugTxt.className = "error";
                    debugTxt.innerHTML = `<b>BŁĄD KAMERY:</b> Dostęp odrzucony lub kamera zajęta.<br><small>${err}</small>`;
                });

            } catch (err) {
                debugTxt.className = "error";
                debugTxt.innerHTML = `<b>BŁĄD MEDIAPIPE:</b> ${err.message}`;
            }
        }

        let ostWysylka = 0;
        function wyslijDoESP(x, y, widzi) {
            if (Date.now() - ostWysylka < 150) return;
            ostWysylka = Date.now();
            licznikWysylania++;
            
            let img = new Image();
            img.src = `http://${ESP_IP}/set?x=${x}&y=${y}&w=${widzi}&t=${Date.now()}`;
        }
    </script>
</body>
</html>
